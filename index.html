<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adobe Animate Spritemap Optimizer</title>
    <style>
        :root {
            --bg-color: #090a0f;
            --panel-color: #12141c;
            --accent-cyan: #06b6d4;
            --text-color: #ffffff;
            --border-color: #242838;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            margin-bottom: 30px;
        }
        .header-title h1 { margin: 0; font-size: 26px; color: #fff; }
        .header-title p { margin: 5px 0 0 0; font-size: 14px; color: #aaa; }

        .module-card {
            background-color: var(--panel-color);
            padding: 30px;
            border-radius: 16px;
            max-width: 550px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-top: 5px solid var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .desc { color: #aaa; font-size: 13px; margin-bottom: 25px; line-height: 1.5; }

        .file-box {
            background: rgba(0,0,0,0.3);
            border: 2px dashed #3b4261;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        .file-box:hover { border-color: var(--accent-cyan); }

        .file-box label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            color: #ddd;
            margin-bottom: 8px;
        }

        .real-input {
            background-color: #242838;
            color: #fff;
            border: 1px solid #4f567a;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: block;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        .status-text { font-size: 13px; color: #ff4560; font-weight: 500; margin-top: 6px; }

        /* --- BOTONES GRANDES FLOTANTES --- */
        .action-btn {
            width: 100%;
            color: white;
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            background: linear-gradient(45deg, var(--accent-cyan), #0284c7);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
            
            /* Animación de flotado continuo */
            animation: floatAnimation 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.6);
            background: linear-gradient(45deg, #0891b2, #0369a1);
        }

        /* Keyframes para el efecto flotar de arriba a abajo */
        @keyframes floatAnimation {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .console {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: rgba(0,0,0,0.6);
            font-size: 14px;
            display: none;
            border-left: 4px solid var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>🎬 Adobe Animate Spritemap Optimizer</h1>
        <p>Formato de Atlas optimizado para Friday Night Funkin</p>
    </div>

    <div class="module-card">
        <div class="desc">Optimiza spritemaps recortando transparencias vacías usando los archivos `spritemap1.json` y `spritemap1.png` sin romper pivots.</div>

        <div class="file-box">
            <label>Imagen del Spritemap (.png):</label>
            <input type="file" id="aniPng" class="real-input" accept="image/png">
            <div id="status-aniPng" class="status-text">Sin cargar</div>
        </div>

        <div class="file-box">
            <label>Diccionario de Sprites (spritemap1.json):</label>
            <input type="file" id="aniJson" class="real-input" accept=".json">
            <div id="status-aniJson" class="status-text">Sin cargar</div>
        </div>

        <button id="btnRunAni" class="action-btn">Optimizar Spritemap JSON</button>
        <div id="console-ani" class="console"></div>
    </div>

    <script>
        function download(url, name) {
            let a = document.createElement('a'); a.download = name; a.href = url; a.click();
        }

        function cambiarEstado(id, texto, exito) {
            let el = document.getElementById(id);
            el.innerText = texto;
            el.style.color = exito ? "#10b981" : "#ff4560";
        }

        let aImg = new Image(), aJson = null, aName = "spritemap1";
        
        document.getElementById('aniPng').addEventListener('change', function() {
            if(!this.files.length) return;
            aName = this.files[0].name.replace(/\.[^/.]+$/, "");
            cambiarEstado('status-aniPng', "✓ " + this.files[0].name, true);
            let r = new FileReader(); r.onload = (e) => aImg.src = e.target.result; r.readAsDataURL(this.files[0]);
        });

        document.getElementById('aniJson').addEventListener('change', function() {
            if(!this.files.length) return;
            cambiarEstado('status-aniJson', "✓ " + this.files[0].name, true);
            let r = new FileReader(); r.onload = (e) => { 
                try { 
                    aJson = JSON.parse(e.target.result); 
                } catch(err) { 
                    cambiarEstado('status-aniJson', "❌ JSON Inválido", false);
                } 
            }; r.readAsText(this.files[0]);
        });

        document.getElementById('btnRunAni').addEventListener('click', function() {
            let box = document.getElementById('console-ani'); box.style.display = "block";
            if(!aJson || !aImg.src) { box.innerHTML = "❌ Carga los archivos .png y .json primero."; return; }
            box.innerHTML = "Optimizado Spritemap...";

            try {
                let srcCanvas = document.createElement('canvas'); srcCanvas.width = aImg.width; srcCanvas.height = aImg.height;
                srcCanvas.getContext('2d').drawImage(aImg, 0, 0);

                let outCanvas = document.createElement('canvas'); let outCtx = outCanvas.getContext('2d');
                let totalHeight = 0, maxWidth = 0;

                // Captura la lista según tu formato exacto (ATLAS.SPRITES)
                let rawSprites = [];
                if (aJson.ATLAS && Array.isArray(aJson.ATLAS.SPRITES)) {
                    rawSprites = aJson.ATLAS.SPRITES;
                } else if (Array.isArray(aJson.sprites)) {
                    rawSprites = aJson.sprites;
                } else {
                    throw new Error("No se encontró la estructura ATLAS.SPRITES en tu JSON.");
                }

                // Mapear y medir los sprites reales
                for(let item of rawSprites) {
                    let spr = item.SPRITE || item; // Soporta si viene envuelto en SPRITE o directo
                    let w = parseInt(spr.w || 0), h = parseInt(spr.h || 0);
                    if(w > maxWidth) maxWidth = w;
                    totalHeight += h + 4;
                }
                outCanvas.width = maxWidth + 4; outCanvas.height = totalHeight + 4;

                let currentY = 2;
                for(let item of rawSprites) {
                    let spr = item.SPRITE || item;
                    let x = parseInt(spr.x || 0), y = parseInt(spr.y || 0);
                    let w = parseInt(spr.w || 0), h = parseInt(spr.h || 0);
                    
                    // Dibujar el sprite en la nueva textura vertical compacta
                    outCtx.drawImage(srcCanvas, x, y, w, h, 2, currentY, w, h);
                    
                    // Actualizar las coordenadas en el JSON original
                    spr.x = 2;
                    spr.y = currentY;
                    currentY += h + 4;
                }

                // Descargar ambos archivos optimizados
                download(outCanvas.toDataURL('image/png'), `${aName}_optimized.png`);
                download(URL.createObjectURL(new Blob([JSON.stringify(aJson, null, 2)], {type: "application/json"})), `${aName}_optimized.json`);
                box.innerHTML = "✓ ¡Spritemap optimizado con éxito para FNF!";
            } catch(err) {
                box.innerHTML = "❌ Error: " + err.message;
            }
        });
