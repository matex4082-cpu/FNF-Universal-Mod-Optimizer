<script>
    function download(url, name) {
        let a = document.createElement('a'); a.download = name; a.href = url; a.click();
    }

    // Función auxiliar para cambiar el estado visual de forma segura
    function actualizarEstado(idInput, text, color) {
        let el = document.getElementById('status-' + idInput);
        if(el) {
            el.innerText = text;
            el.style.color = color;
        }
    }

    // --- LÓGICA 1: PERSONAJES ---
    let cImg = new Image(), cXml = "", cName = "character";
    
    document.getElementById('charPng').addEventListener('change', function() {
        if(!this.files.length) return;
        cName = this.files[0].name.replace(/\.[^/.]+$/, "");
        actualizarEstado('charPng', "✓ " + this.files[0].name, "#10b981");
        let r = new FileReader(); r.onload = (e) => cImg.src = e.target.result; r.readAsDataURL(this.files[0]);
    });

    document.getElementById('charXml').addEventListener('change', function() {
        if(!this.files.length) return;
        actualizarEstado('charXml', "✓ " + this.files[0].name, "#10b981");
        let r = new FileReader(); r.onload = (e) => cXml = e.target.result; r.readAsText(this.files[0]);
    });

    document.getElementById('btnRunChar').addEventListener('click', function() {
        let box = document.getElementById('console-char'); box.style.display = "block";
        if(!cXml || !cImg.src) { box.innerHTML = "❌ Carga los archivos PNG y XML primero."; return; }
        box.innerHTML = "Procesando personaje...";
        
        try {
            let xmlDoc = new DOMParser().parseFromString(cXml, "text/xml");
            let subTextures = xmlDoc.getElementsByTagName("SubTexture");
            let srcCanvas = document.createElement('canvas'); srcCanvas.width = cImg.width; srcCanvas.height = cImg.height;
            srcCanvas.getContext('2d').drawImage(cImg, 0, 0);

            let outCanvas = document.createElement('canvas'); let outCtx = outCanvas.getContext('2d');
            let frames = [], totalHeight = 0, maxWidth = 0;

            for(let i=0; i<subTextures.length; i++) {
                let st = subTextures[i];
                let x = parseInt(st.getAttribute('x')), y = parseInt(st.getAttribute('y'));
                let w = parseInt(st.getAttribute('width')), h = parseInt(st.getAttribute('height'));
                let isRotated = st.getAttribute('rotated') === "true";
                let cw = isRotated ? h : w, ch = isRotated ? w : h;
                let imgData = srcCanvas.getContext('2d').getImageData(x, y, cw, ch);
                let p = imgData.data; let minX = cw, minY = ch, maxX = 0, maxY = 0, any = false;

                for(let fy=0; fy<ch; fy++) {
                    for(let fx=0; fx<cw; fx++) {
                        if(p[(fy * cw + fx) * 4 + 3] > 8) {
                            if(fx < minX) minX = fx; if(fx > maxX) maxX = fx;
                            if(fy < minY) minY = fy; if(fy > maxY) maxY = fy;
                            any = true;
                        }
                    }
                }
                if(!any) { minX = 0; minY = 0; maxX = 5; maxY = 5; }
                let finalW = (maxX - minX) + 1, finalH = (maxY - minY) + 1;
                frames.push({ element: st, x: x + minX, y: y + minY, w: finalW, h: finalH, trimX: minX, trimY: minY });
                if(finalW > maxWidth) maxWidth = finalW; totalHeight += finalH + 4;
            }

            outCanvas.width = maxWidth + 4; outCanvas.height = totalHeight + 4;
            let currentY = 2;
            for(let f of frames) {
                if(f.w > 0 && f.h > 0) outCtx.drawImage(srcCanvas, f.x, f.y, f.w, f.h, 2, currentY, f.w, f.h);
                let fx = parseInt(f.element.getAttribute('frameX') || 0), fy = parseInt(f.element.getAttribute('frameY') || 0);
                f.element.setAttribute('x', "2"); f.element.setAttribute('y', currentY.toString());
                f.element.setAttribute('width', f.w.toString()); f.element.setAttribute('height', f.h.toString());
                f.element.setAttribute('frameX', (fx - f.trimX).toString()); f.element.setAttribute('frameY', (fy - f.trimY).toString());
                currentY += f.h + 4;
            }
            download(outCanvas.toDataURL('image/png'), `${cName}_optimized.png`);
            download(URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(xmlDoc)], {type: "text/xml"})), `${cName}_optimized.xml`);
            box.innerHTML = "✓ ¡Personaje Optimizado!";
        } catch(err) {
            box.innerHTML = "❌ Error al procesar: " + err.message;
        }
    });

    // --- LÓGICA 2: STAGES ---
    let sImg = new Image(), sXml = "", sName = "stage_atlas";
    
    document.getElementById('stPng').addEventListener('change', function() {
        if(!this.files.length) return;
        sName = this.files[0].name.replace(/\.[^/.]+$/, "");
        actualizarEstado('stPng', "✓ " + this.files[0].name, "#10b981");
        let r = new FileReader(); r.onload = (e) => sImg.src = e.target.result; r.readAsDataURL(this.files[0]);
    });

    document.getElementById('stXml').addEventListener('change', function() {
        if(!this.files.length) return;
        actualizarEstado('stXml', "✓ " + this.files[0].name, "#10b981");
        let r = new FileReader(); r.onload = (e) => sXml = e.target.result; r.readAsText(this.files[0]);
    });

    document.getElementById('btnRunStAtlas').addEventListener('click', function() {
        let box = document.getElementById('console-stage'); box.style.display = "block";
        if(!sXml || !sImg.src) { box.innerHTML = "❌ Carga los archivos del Atlas del stage."; return; }
        box.innerHTML = "Procesando Stage Atlas...";

        try {
            let xmlDoc = new DOMParser().parseFromString(sXml, "text/xml");
            let subTextures = xmlDoc.getElementsByTagName("SubTexture");
            let srcCanvas = document.createElement('canvas'); srcCanvas.width = sImg.width; srcCanvas.height = sImg.height;
            srcCanvas.getContext('2d').drawImage(sImg, 0, 0);

            let outCanvas = document.createElement('canvas'); let outCtx = outCanvas.getContext('2d');
            let frames = [], totalHeight = 0, maxWidth = 0;

            for(let i=0; i<subTextures.length; i++) {
                let st = subTextures[i];
                let x = parseInt(st.getAttribute('x')), y = parseInt(st.getAttribute('y'));
                let w = parseInt(st.getAttribute('width')), h = parseInt(st.getAttribute('height'));
                let isRotated = st.getAttribute('rotated') === "true";
                let cw = isRotated ? h : w, ch = isRotated ? w : h;
                let imgData = srcCanvas.getContext('2d').getImageData(x, y, cw, ch);
                let p = imgData.data; let minX = cw, minY = ch, maxX = 0, maxY = 0, any = false;

                for(let fy=0; fy<ch; fy++) {
                    for(let fx=0; fx<cw; fx++) {
                        if(p[(fy * cw + fx) * 4 + 3] > 8) {
                            if(fx < minX) minX = fx; if(fx > maxX) maxX = fx;
                            if(fy < minY) minY = fy; if(fy > maxY) maxY = fy;
                            any = true;
                        }
                    }
                }
                if(!any) { minX = 0; minY = 0; maxX = 5; maxY = 5; }
                let finalW = (maxX - minX) + 1, finalH = (maxY - minY) + 1;
                frames.push({ element: st, x: x + minX, y: y + minY, w: finalW, h: finalH, trimX: minX, trimY: minY });
                if(finalW > maxWidth) maxWidth = finalW; totalHeight += finalH + 4;
            }

            outCanvas.width = maxWidth + 4; outCanvas.height = totalHeight + 4;
            let currentY = 2;
            for(let f of frames) {
                if(f.w > 0 && f.h > 0) outCtx.drawImage(srcCanvas, f.x, f.y, f.w, f.h, 2, currentY, f.w, f.h);
                let fx = parseInt(f.element.getAttribute('frameX') || 0), fy = parseInt(f.element.getAttribute('frameY') || 0);
                f.element.setAttribute('x', "2"); f.element.setAttribute('y', currentY.toString());
                f.element.setAttribute('width', f.w.toString()); f.element.setAttribute('height', f.h.toString());
                f.element.setAttribute('frameX', (fx - f.trimX).toString()); f.element.setAttribute('frameY', (fy - f.trimY).toString());
                currentY += f.h + 4;
            }
            download(outCanvas.toDataURL('image/png'), `${sName}_optimized.png`);
            download(URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(xmlDoc)], {type: "text/xml"})), `${sName}_optimized.xml`);
            box.innerHTML = "✓ ¡Stage Atlas optimizado!";
        } catch(err) {
            box.innerHTML = "❌ Error: " + err.message;
        }
    });

    document.getElementById('stMulti').addEventListener('change', function() {
        let el = document.getElementById('status-stMulti');
        if(el) {
            el.innerText = "✓ " + this.files.length + " imágenes listas";
            el.style.color = "#10b981";
        }
    });

    document.getElementById('btnRunStMulti').addEventListener('click', async function() {
        let box = document.getElementById('console-stage'); box.style.display = "block";
        let files = document.getElementById('stMulti').files;
        if(!files.length) { box.innerHTML = "❌ Sube archivos png."; return; }

        try {
            for(let i=0; i<files.length; i++) {
                let file = files[i];
                box.innerHTML = `Comprimiendo sueltas [${i+1}/${files.length}]...`;
                let img = await new Promise(res => { let r = new FileReader(); r.onload = (e) => { let im = new Image(); im.onload = () => res(im); im.src = e.target.result; }; r.readAsDataURL(file); });
                let canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * 0.85); canvas.height = Math.round(img.height * 0.85);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                download(canvas.toDataURL('image/png'), file.name.replace(/\.[^/.]+$/, "") + "_optimized.png");
            }
            box.innerHTML = "✓ ¡Todas las imágenes múltiples optimizadas!";
        } catch(err) {
            box.innerHTML = "❌ Error: " + err.message;
        }
    });

    let singleImgSrc = new Image(), singleName = "asset";
    document.getElementById('stSingle').addEventListener('change', function() {
        if(!this.files.length) return;
        singleName = this.files[0].name.replace(/\.[^/.]+$/, "");
        actualizarEstado('stSingle', "✓ " + this.files[0].name, "#10b981");
        let r = new FileReader(); r.onload = (e) => singleImgSrc.src = e.target.result; r.readAsDataURL(this.files[0]);
    });

    document.getElementById('btnRunStSingle').addEventListener('click', function() {
        let box = document.getElementById('console-stage'); box.style.display = "block";
        if(!singleImgSrc.src) { box.innerHTML = "❌ Selecciona un archivo PNG individual."; return; }
        let canvas = document.createElement('canvas');
        canvas.width = Math.round(singleImgSrc.width * 0.85); canvas.height = Math.round(singleImgSrc.height * 0.85);
        canvas.getContext('2d').drawImage(singleImgSrc, 0, 0, canvas.width, canvas.height);
        download(canvas.toDataURL('image/png'), `${singleName}_optimized.png`);
        box.innerHTML = "✓ ¡Asset individual optimizado!";
    });

    // --- LÓGICA 3: ADOBE ANIMATE JSON ---
    let aImg = new Image(), aJson = null, aName = "spritemap1";
    
    document.getElementById('aniPng').addEventListener('change', function() {
        if(!this.files.length) return;
        aName = this.files[0].name.replace(/\.[^/.]+$/, "");
        actualizarEstado('aniPng', "✓ " + this.files[0].name, "#10b981");
        let r = new FileReader(); r.onload = (e) => aImg.src = e.target.result; r.readAsDataURL(this.files[0]);
    });

    document.getElementById('aniJson').addEventListener('change', function() {
        if(!this.files.length) return;
        actualizarEstado('aniJson', "✓ " + this.files[0].name, "#10b981");
        let r = new FileReader(); r.onload = (e) => { try { aJson = JSON.parse(e.target.result); } catch(err) { alert("JSON Inválido"); } }; r.readAsText(this.files[0]);
    });

    document.getElementById('btnRunAni').addEventListener('click', function() {
        let box = document.getElementById('console-ani'); box.style.display = "block";
        if(!aJson || !aImg.src) { box.innerHTML = "❌ Carga los archivos .png y .json de Animate primero."; return; }
        box.innerHTML = "Optimizado Spritemap...";

        try {
            let srcCanvas = document.createElement('canvas'); srcCanvas.width = aImg.width; srcCanvas.height = aImg.height;
            srcCanvas.getContext('2d').drawImage(aImg, 0, 0);

            let outCanvas = document.createElement('canvas'); let outCtx = outCanvas.getContext('2d');
            let totalHeight = 0, maxWidth = 0;

            for(let spr of aJson.meta.sprites) {
                if(spr.w > maxWidth) maxWidth = spr.w;
                totalHeight += spr.h + 4;
            }
            outCanvas.width = maxWidth + 4; outCanvas.height = totalHeight + 4;

            let currentY = 2;
            for(let spr of aJson.meta.sprites) {
                outCtx.drawImage(srcCanvas, spr.x, spr.y, spr.w, spr.h, 2, currentY, spr.w, spr.h);
                spr.x = 2;
                spr.y = currentY;
                currentY += spr.h + 4;
            }

            download(outCanvas.toDataURL('image/png'), `${aName}_optimized.png`);
            download(URL.createObjectURL(new Blob([JSON.stringify(aJson, null, 2)], {type: "application/json"})), `${aName}_optimized.json`);
            box.innerHTML = "✓ ¡Spritemap de Adobe Animate optimizado!";
        } catch(err) {
            box.innerHTML = "❌ Error: " + err.message;
        }
    });
</script>
